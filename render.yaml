# Blueprint do Render: cria o serviço da API automaticamente a partir do GitHub.
services:
  - type: web
    name: cmtt-api
    runtime: python
    plan: free
    region: ohio
    rootDir: api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/saude
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        sync: false          # valor secreto: preenchido manualmente no painel do Render
      - key: GITHUB_USUARIO
        value: vambertorafaldini2014-ctrl
      - key: GITHUB_REPO
        value: CodigoCMTT
      - key: CORS_ORIGINS
        value: "*"
